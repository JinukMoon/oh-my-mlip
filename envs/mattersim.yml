# build_status: clean
# oh-my-mlip env recipe: MatterSim (mattersim)
#
# Pins: python 3.10.16 / torch 2.6.0+cu124.
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - torch is pinned to CUDA 12.4 (cu124) from the official PyTorch wheel index;
#     the host NVIDIA driver must satisfy the cu124 min-driver floor.
#   - cuda-nvcc 12.4.* is included for D3 dispersion kernel compilation.
#   - mattersim is installed from a specific git commit. torch-geometric and e3nn
#     are public dependencies.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
name: mattersim
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.10.16
  - pip
  # CUDA 12.4 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.4.*
  # ase is pinned because mattersim uses full_3x3_to_voigt_6_stress from
  # ase.constraints, which was moved/removed in ASE >= 3.25. Unpinned ase floats
  # to a breaking version.
  - ase=3.24.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - mattersim @ git+https://github.com/microsoft/mattersim.git@bf13be6f6fd470fd4e299855c755ad13968620bb
      - torch-geometric==2.6.1
      - e3nn==0.5.6
      # mattersim imports pkg_resources at runtime; setuptools>=81 removed it.
      # Pin a version that still ships pkg_resources.
      - setuptools==75.8.0
