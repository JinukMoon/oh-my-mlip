# build_status: candidate
# candidate-reason: torch cu130 requires an NVIDIA driver at the CUDA 13.0+ level. GPU inference requires appropriate driver support.
# oh-my-mlip env recipe: DPA-4 (deepmd-kit 3.2 line)
#
# Pins: python 3.11.15 / torch 2.11.0+cu130.
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - torch is pinned to CUDA 13.0 (cu130) from the official PyTorch wheel index;
#     the host NVIDIA driver must satisfy the cu130 min-driver floor.
#   - cuda-nvcc 13.0.* is included for D3 dispersion kernel compilation.
#   - deepmd-kit is pinned to the 3.2.0b0 pre-release for DPA-4. Requires MPI runtime
#     (mpich) and pulls a large nvidia-cu13 stack.
#   - models.json sets env_run: LD_LIBRARY_PATH="" for this env to avoid host MPI
#     library clashes at inference time.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
name: dpa4
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11.15
  - pip
  # CUDA 13.0 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=13.0.*
  - ase=3.28.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.11.0+cu130
      - deepmd-kit==3.2.0b0
      - e3nn==0.6.0
      - vesin==0.5.8
      - vesin-torch==0.5.8
      # deepmd-kit load_mpi_library() needs the mpich PIP package (Python metadata).
      - mpich==5.0.1
      # Fine-tuning dataset converter (extxyz -> deepmd/npy system layout), same
      # pin as envs/deepmd.yml. scripts/ft_dataset.py prefers dpdata and falls
      # back to its own numpy writer when absent; pinned so the fine-tune path
      # is reproducible from the recipe alone. Pure-python; deps (h5py, wcmatch,
      # lmdb, msgpack, PyYAML) resolve against the deepmd-kit 3.2.0b0 stack.
      - dpdata==1.1.0
