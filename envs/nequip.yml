# build_status: candidate
# candidate-reason: NequIP AOT-compiled .pt2 weights are per-GPU-arch artifacts; compile with nequip-compile on the target GPU (see docs/compile.md). OpenEquivariance requires CUDA dev libraries (nvrtc-dev, cuda-driver-dev) and ninja for first-run JIT compilation.
# oh-my-mlip env recipe: NequIP (nequip)
#
# Pins: python 3.11.13 / torch 2.9.1+cu128.
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - torch is pinned to CUDA 12.8 (cu128) from the official PyTorch wheel index;
#     the host NVIDIA driver must satisfy the cu128 min-driver floor.
#   - cuda-nvcc 12.8.* is included for D3 dispersion and OpenEquivariance CUDA builds.
#   - nequip is pinned to a specific version; e3nn is its top-level dependency.
#   - OpenEquivariance compiles from source and requires cuda-nvrtc-dev and
#     cuda-driver-dev for CUDA extension linking at first use.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
name: nequip
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11.13
  - pip
  # CUDA 12.8 toolchain (provides nvcc for D3 and for openequivariance's build)
  - cuda-nvcc=12.8.*
  # openequivariance JIT-links its extension with -lnvrtc -lcuda at first use:
  # cuda-nvrtc-dev ships the unversioned libnvrtc.so (the pip wheel has only .so.12)
  # and cuda-driver-dev the libcuda.so link stub (targets/<arch>/lib/stubs); the
  # provider puts those dirs on LIBRARY_PATH. The real driver libcuda loads at runtime.
  - cuda-nvrtc-dev=12.8.93
  - cuda-driver-dev=12.8.90
  - ase=3.26.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1+cu128
      - nequip==0.15.0
      - e3nn==0.5.7
      - openequivariance==0.4.1
      # oeq JIT-compiles its CUDA extension at first use -> needs ninja on PATH.
      - ninja==1.13.0
      - setuptools==80.9.0
