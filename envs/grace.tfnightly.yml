# build_status: candidate
# candidate-reason: sm120 needs a TensorFlow nightly (2.23.0.dev20261117); released TF 2.16.2-2.21.0 fail on sm120, and tensorpotential 0.5.3 declares tensorflow<2.20, so it is installed --no-deps.
# sibling_of: grace
# arch: sm120
# oh-my-mlip SIBLING recipe for sm120 (Blackwell, compute capability 12.0): GRACE.
#
# envs/grace.yml (tensorflow[and-cuda]==2.16.2) stays the recipe for every older
# GPU and is unchanged. Released TensorFlow wheels carry no sm_120 kernels and
# their PTX does not JIT there. Checked on an sm120 GPU (driver 615):
#   2.16.2, 2.19.1, 2.20.0  -> first GPU kernel fails (CUDA_ERROR_INVALID_PTX /
#                              CUDA_ERROR_INVALID_HANDLE in cuLaunchKernel)
#   2.21.0                  -> GPU not registered ("Cannot dlopen some GPU libraries")
#   tf-nightly 2.23.0.dev20261117 -> GPU single point OK (GRACE-2L-OAM)
# so install.sh builds THIS recipe on sm120, through the sidecar
# envs/grace.tfnightly.build.sh: tensorpotential 0.5.3 (same as the base)
# declares tensorflow<2.20 and is installed --no-deps on top of the nightly.
# CAVEAT: a nightly is not a release, and this TF / tensorpotential pair is outside
# upstream's declared range. Replace it with the first TF release that runs on
# sm120 once tensorpotential allows it.
#
# The env is still built at envs/grace/; the recipe used is recorded in
# envs/grace/.omm_recipe.
name: grace
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.11
  - pip
  - ase=3.29.0
  - pip:
      - tf-nightly[and-cuda]==2.23.0.dev20261117
      - tf_keras-nightly==2.23.0.dev2026111709
      - keras-nightly==3.16.0.dev2026111703
      - matscipy==1.3.1
      - sympy==1.14.0
      - pandas==2.3.3
      - pyyaml==6.0.3
      - tqdm==4.70.1
      # tensorpotential==0.5.3 is installed --no-deps by the sidecar (it pins
      # tensorflow<2.20); listed here for reference only.
