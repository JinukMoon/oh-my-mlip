# build_status: clean
# build_note: Nequix is JAX-native. OpenEquivariance is optional and intentionally omitted here; the JAX backend uses e3nn-jax tensor products instead (use_kernel=False).
# oh-my-mlip env recipe: Nequix (nequix, JAX-based)
#
# Pins: python 3.11.13 / torch 2.10.0+cu126 (torch kept for optional compatibility).
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - Nequix runs on JAX; torch is pinned to CUDA 12.6 (cu126) because parts of
#     the stack still link torch. The host NVIDIA driver must satisfy the cu126
#     min-driver floor.
#   - cuda-nvcc 12.6.* is included for D3 dispersion and (optionally) OpenEquivariance
#     CUDA extension compilation.
#   - nequix, jax==0.6.2, jax-cuda12-plugin, and jax-cuda12-pjrt provide the JAX backend.
#   - e3nn-jax and equinox are top-level dependencies.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
name: nequix
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11.13
  - pip
  # CUDA 12.6 toolchain (provides nvcc for D3 and for openequivariance's build)
  - cuda-nvcc=12.6.*
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.10.0+cu126
      - nequix==0.4.3
      - jax==0.6.2
      - jax-cuda12-plugin==0.6.2
      - jax-cuda12-pjrt==0.6.2
      - jaxlib==0.6.2
      - e3nn-jax==0.20.8
      - equinox==0.13.6
      # openequivariance / openequivariance_extjax INTENTIONALLY OMITTED: oeq is
      # OPTIONAL (upstream `pip install nequix[oeq]`), its 0.6.4 sdist fails a
      # nanobind/CMake build on this host (no cp310 wheel), and it is NOT needed.
      # The default JAX backend runs WITHOUT kernels via use_kernel=False
      # (e3nn-jax tensor products), which is the verified path here. torch torch
      # is kept only for nequix's optional torch backend import; the verified
      # single-point uses backend='jax'.
