# build_status: clean
# sibling_of: alphanet
# arch: sm120
# oh-my-mlip SIBLING recipe for sm120 (Blackwell, compute capability 12.0).
#
# envs/alphanet.yml stays the recipe for every older GPU (validated on sm89) and is
# unchanged. Its torch build (+cu121) ships no sm_120 kernels ("CUDA error: no
# kernel image is available"), so install.sh selects THIS file instead when the
# host GPU is sm120 (table: envs/_arch_recipes.json). The env is still built at
# envs/alphanet/ and the recipe used is recorded in envs/alphanet/.omm_recipe.
#
# Changes against envs/alphanet.yml: TORCH RAISED 2.1.2+cu121 -> 2.7.1+cu128
#   (no cu128 build of torch 2.1.2 exists), torch-scatter +pt21cu121 -> +pt27cu128,
#   cuda-nvcc 12.1 -> 12.8. The sidecar installs numpy 1.26.4 as the base does;
#   install.sh's catbench step then raises it to 2.x (catbench -> pandas 3), which
#   torch 2.7.1 supports (verified on sm120 with numpy 2.4.6, see the lock). Built by the sidecar
#   envs/alphanet.cu128.build.sh. A raised torch changes the numerical stack:
#   energies/forces were compared with the base stack (sm120 pull request).
# Added: gxx=14.4.0 + ninja (host compiler nvcc accepts, JIT build tool; see the
#   dependency comment).
# Everything else (framework pins, ase, extras) is identical to the base recipe.
#
name: alphanet
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11.13
  - pip
  # CUDA 12.8 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.8.*
  # Host compiler for nvcc (D3 kernel, OpenEquivariance/extension JIT builds):
  # CUDA 12.x accepts gcc <= 14, and a current distribution may ship a newer
  # system gcc (Ubuntu 26.04: gcc 15 -> "unsupported GNU version"). The worker
  # puts this env's bin/ first on PATH, so nvcc picks this gcc 14. torch's
  # extension JIT (the D3 kernel) also runs `ninja` from PATH.
  - gxx=14.4.0
  - ninja=1.13.2
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      # torch-scatter +pt21cu121 wheels are on the PyG wheel index.
      - --find-links https://data.pyg.org/whl/torch-2.7.1+cu128.html
      - torch==2.7.1+cu128
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2+pt27cu128
      # AlphaNet framework is pinned in the sidecar (envs/alphanet.cu128.build.sh).
      # Do not use floating
      # git+https://github.com/zmyybc/AlphaNet.git.
