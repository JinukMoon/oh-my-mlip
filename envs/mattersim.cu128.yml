# build_status: clean
# sibling_of: mattersim
# arch: sm120
# oh-my-mlip SIBLING recipe for sm120 (Blackwell, compute capability 12.0).
#
# envs/mattersim.yml stays the recipe for every older GPU (validated on sm89) and is
# unchanged. Its torch build (+cu124) ships no sm_120 kernels ("CUDA error: no
# kernel image is available"), so install.sh selects THIS file instead when the
# host GPU is sm120 (table: envs/_arch_recipes.json). The env is still built at
# envs/mattersim/ and the recipe used is recorded in envs/mattersim/.omm_recipe.
#
# Changes against envs/mattersim.yml: TORCH RAISED 2.6.0+cu124 -> 2.7.1+cu128
#   (no cu128 build of torch 2.6.0 exists), torchvision/torchaudio pinned to the
#   matching +cu128 builds, cuda-nvcc 12.4 -> 12.8. A raised torch changes the
#   numerical stack: energies/forces were compared with the base stack.
# Added: gxx=14.4.0 + ninja (host compiler nvcc accepts, JIT build tool; see the
#   dependency comment).
# Everything else (framework pins, ase, extras) is identical to the base recipe.
#
name: mattersim
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.10.16
  - pip
  # CUDA 12.8 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.8.*
  # Host compiler for nvcc (D3 kernel, OpenEquivariance/extension JIT builds):
  # CUDA 12.x accepts gcc <= 14, and a current distribution may ship a newer
  # system gcc (Ubuntu 26.04: gcc 15 -> "unsupported GNU version"). The worker
  # puts this env's bin/ first on PATH, so nvcc picks this gcc 14. torch's
  # extension JIT (the D3 kernel) also runs `ninja` from PATH.
  - gxx=14.4.0
  - ninja=1.13.2
  # ase is pinned because mattersim uses full_3x3_to_voigt_6_stress from
  # ase.constraints, which was moved/removed in ASE >= 3.25. Unpinned ase floats
  # to a breaking version.
  - ase=3.24.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      # mattersim requires torchvision/torchaudio; pinned to the matching cu128
      # builds so pip cannot pull a CPU or mismatched-CUDA wheel from PyPI.
      - torchvision==0.22.1+cu128
      - torchaudio==2.7.1+cu128
      - mattersim @ git+https://github.com/microsoft/mattersim.git@bf13be6f6fd470fd4e299855c755ad13968620bb
      - torch-geometric==2.6.1
      - e3nn==0.5.6
      # mattersim imports pkg_resources at runtime; setuptools>=81 removed it.
      # Pin a version that still ships pkg_resources.
      - setuptools==75.8.0
