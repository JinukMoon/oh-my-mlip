# build_status: clean
# oh-my-mlip env recipe: MACE-SOYO (mace-soyo, its own package; MACECalculator
# does not load it)
#
# Pins: python 3.12 / torch 2.12.0+cu126 / mace-soyo at the commit Matbench
# Discovery pins for MACE-SOYO-OAM / the rest from upstream requirements.txt at
# that commit (tested there with Python 3.14.7 and CUDA 12.6; the package allows
# >=3.12,<3.15, and 3.12 was checked here).
#
#   - mace-soyo is not on PyPI: installed from github.com/PrincessHakuryu/MACE-SOYO
#     at 387b5114c974fb04b8aceffac82d1d8f10ea4ac0.
#   - Inference loads an AOTInductor .pt2 compiled for one GPU architecture.
#     scripts/prepare_mace_soyo_weights.py makes it after the build (once per
#     arch; several minutes): it needs nvcc, the CUDA headers and libraries, and
#     a C++ compiler, which this env supplies apart from the compiler.
#   - CUDA only: upstream rejects CPU for export and inference.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.7`, WITH deps).
name: mace_soyo
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.12.12
  - pip
  # CUDA 12.6 toolchain (nvcc for the D3 kernel and the AOTI compile)
  - cuda-nvcc=12.6.*
  - cuda-nvrtc-dev=12.6.85
  - cuda-driver-dev=12.6.77
  - libcublas-dev=12.6.4.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.12.0+cu126
      - cuequivariance==0.12.0
      - cuequivariance-torch==0.12.0
      - cuequivariance-ops-cu12==0.12.0
      - cuequivariance-ops-torch-cu12==0.12.0
      - nvalchemi-toolkit-ops[torch]==0.4.1
      - warp-lang==1.13.0
      - torch-ema==0.3
      - torch-geometric==2.7.0
      - torch-sim-atomistic==0.6.1
      # ase is pinned to avoid upstream breakage. verify_determinism verifies the pin.
      - ase==3.29.0
      - ase-db-backends==0.11.0
      - lmdb==2.3.0
      - h5py==3.16.0
      - tables==3.11.1
      - numpy==2.4.6
      - scipy==1.18.1
      - PyYAML==6.0.3
      - tqdm==4.70.1
      - opt_einsum_fx==0.1.4
      - cffi==2.1.1
      - ninja==1.13.0
      - mace-soyo @ git+https://github.com/PrincessHakuryu/MACE-SOYO.git@387b5114c974fb04b8aceffac82d1d8f10ea4ac0
