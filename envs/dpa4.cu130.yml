# base + ninja + pinned gxx 15.3.0 for sm120 (D3 kernel build); otherwise identical to envs/dpa4.yml
# build_status: candidate
# candidate-reason: torch cu130 requires an NVIDIA driver at the CUDA 13.0+ level. GPU inference requires appropriate driver support.
# sibling_of: dpa4
# arch: sm120
# oh-my-mlip SIBLING recipe for sm120 (Blackwell, compute capability 12.0).
#
# envs/dpa4.yml stays the recipe for every older GPU (validated on sm89) and is
# unchanged. Its torch build (+cu130) already runs on sm120, but it names no
# ninja and no host compiler, so on an sm120 host with Ubuntu 26.04 (system gcc 15,
# no system CUDA) the D3 kernel build (catbench pair_d3.so, scripts/build_d3.py)
# failed: "Ninja is required to load C++ extensions". install.sh selects THIS file
# instead when the host GPU is sm120 (table: envs/_arch_recipes.json). The env is
# still built at envs/dpa4/ and the recipe used is recorded in envs/dpa4/.omm_recipe.
#
# Changes against envs/dpa4.yml: none to its pins.
# Added: gxx=15.3.0 + ninja=1.13.2 (host compiler nvcc 13.0 accepts, JIT build
#   tool; see the dependency comment). The compiler is the one this env already
#   pulled in unpinned on that host, which built D3 there.
# Everything else (python, torch, framework pins, ase, extras) is identical to the base recipe.
#
name: dpa4
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11.15
  - pip
  # CUDA 13.0 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=13.0.*
  # Host compiler for nvcc (D3 kernel and other extension JIT builds): CUDA
  # 13.0 accepts gcc <= 15, and a current distribution may ship another system gcc
  # (Ubuntu 26.04: gcc 15). scripts/build_d3.py and the worker put this env's bin/
  # first on PATH and build_d3.py sets CC/CXX to this compiler. torch's extension
  # JIT (the D3 kernel) also runs `ninja` from PATH.
  - gxx=15.3.0
  - ninja=1.13.2
  - ase=3.28.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.11.0+cu130
      - deepmd-kit==3.2.0b0
      - e3nn==0.6.0
      - vesin==0.5.8
      - vesin-torch==0.5.8
      # deepmd-kit load_mpi_library() needs the mpich PIP package (Python metadata).
      - mpich==5.0.1
      # Fine-tuning dataset converter (extxyz -> deepmd/npy system layout), same
      # pin as envs/deepmd.yml. scripts/ft_dataset.py prefers dpdata and falls
      # back to its own numpy writer when absent; pinned so the fine-tune path
      # is reproducible from the recipe alone. Pure-python; deps (h5py, wcmatch,
      # lmdb, msgpack, PyYAML) resolve against the deepmd-kit 3.2.0b0 stack.
      - dpdata==1.1.0
