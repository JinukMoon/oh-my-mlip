# build_status: clean
# sibling_of: equiformer_v3
# arch: sm120
# oh-my-mlip SIBLING recipe for sm120 (Blackwell, compute capability 12.0).
#
# envs/equiformer_v3.yml stays the recipe for every older GPU (validated on sm89) and is
# unchanged. Its torch build (+cu128) already runs on sm120, but it names no
# ninja and no host compiler, so on an sm120 host with Ubuntu 26.04 (system gcc 15,
# no system CUDA) the D3 kernel build (catbench pair_d3.so, scripts/build_d3.py)
# failed: "Ninja is required to load C++ extensions". install.sh selects THIS file
# instead when the host GPU is sm120 (table: envs/_arch_recipes.json). The env is
# still built at envs/equiformer_v3/ and the recipe used is recorded in envs/equiformer_v3/.omm_recipe.
#
# Changes against envs/equiformer_v3.yml: none to its pins.
# Added: gxx=14.4.0 + ninja=1.13.2 (host compiler nvcc 12.8 accepts, JIT build
#   tool; see the dependency comment). The compiler is the one this env already
#   pulled in unpinned on that host, which built D3 there.
# Everything else (python, torch, framework pins, ase, extras) is identical to the base recipe.
#
name: equiformer_v3
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11.15
  - pip
  # CUDA 12.8 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.8.*
  # Host compiler for nvcc (D3 kernel and other extension JIT builds): CUDA
  # 12.8 accepts gcc <= 14, and a current distribution may ship another system gcc
  # (Ubuntu 26.04: gcc 15). scripts/build_d3.py and the worker put this env's bin/
  # first on PATH and build_d3.py sets CC/CXX to this compiler. torch's extension
  # JIT (the D3 kernel) also runs `ninja` from PATH.
  - gxx=14.4.0
  - ninja=1.13.2
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      # torch_scatter +pt27cu128 wheels are on the PyG wheel index.
      - --find-links https://data.pyg.org/whl/torch-2.7.1+cu128.html
      - torch==2.7.1+cu128
      - torch-geometric==2.7.0
      - torch_scatter==2.1.2+pt27cu128
      - torch_sparse==0.6.18+pt27cu128
      - torch_cluster==1.6.3+pt27cu128
      - torch_spline_conv==1.2.2+pt27cu128
      - e3nn==0.5.6
      # scipy MUST be pinned: the vendored fairchem-core gemnet layers import
      # scipy.special.sph_harm, which scipy>=1.17 REMOVED -> an unpinned scipy
      # floats to 1.17.x and the worker fails at import with
      # "cannot import name 'sph_harm' from 'scipy.special'". 1.16.0 still ships it.
      - scipy==1.16.0
      # Vendored fairchem-core from the EquiformerV3 source tree; provides
      # `fairchem.core.OCPCalculator` used by models.json.
      - "fairchem-core @ git+https://github.com/atomicarchitects/equiformer_v3.git@a7300c58df683dc99cb48027d5bfd4c887486c48#subdirectory=packages/fairchem-core"
      # EquiformerV3 framework omitted: tgm_pinmap.json has no public git SHA.
      # Do not install floating git+https://github.com/atomicarchitects/equiformer_v3.git.
