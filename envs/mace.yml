# build_status: clean
# oh-my-mlip env recipe: MACE (mace-torch)
#
# Validated, buildable recipe. Pins mirror the validated internal setup:
#   python 3.11.13 / torch 2.7.1+cu126.
# install.sh builds this env from this recipe; no prebuilt env is distributed.
#
#   - torch is pinned to the CUDA 12.6 build (cu126) from the official PyTorch
#     wheel index; the host NVIDIA driver must satisfy the cu126 min-driver floor.
#   - cuda-nvcc 12.6.* is included so the D3 dispersion kernel can compile on
#     first run (matching the torch CUDA minor).
#   - mace-torch is pinned to the validated git sha.
#   - cuequivariance / e3nn are top-level deps MACE needs; small transitive deps
#     are left to float.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
#   - MACE checkpoints (mace-mpa-0, mace-mh-1) are open-weight and fetched on
#     first run; no weights are bundled in this recipe.
name: mace
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11.13
  - pip
  # CUDA 12.6 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.6.*
  # ase pinned 2026-08-17 to the version present in the env whose GPU
  # single-point verified; a bare `- ase` rode each new release into the
  # build (the mattersim/eqnorm breakage class) and verify_determinism
  # was pip-only, so nothing caught it.
  # This conda pin does not decide the env's ase, though: mace-torch requires
  # an unbounded `ase`, so the pip step below installs its own and replaces
  # this one. The fresh-root build that passed verification (2026-09-14,
  # envs/locks/mace.pip.txt) ended with 3.29.0, so the pip block pins that.
  - ase=3.25.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1+cu126
      - ase==3.29.0
      - mace-torch @ git+https://github.com/ACEsuit/mace.git@100a29149d90a5945eddec1f0940bd88a6e3b363
      - cuequivariance==0.5.1
      - cuequivariance-torch==0.5.1
      - e3nn==0.4.4
