# build_status: clean
# sibling_of: equflash
# arch: sm120
# oh-my-mlip SIBLING recipe for sm120 (Blackwell, compute capability 12.0).
#
# envs/equflash.yml stays the recipe for every older GPU (validated on sm89) and is
# unchanged. Its torch build (+cu126) ships no sm_120 kernels ("CUDA error: no
# kernel image is available"), so install.sh selects THIS file instead when the
# host GPU is sm120 (table: envs/_arch_recipes.json). The env is still built at
# envs/equflash/ and the recipe used is recorded in envs/equflash/.omm_recipe.
#
# Changes against envs/equflash.yml: torch 2.9.1+cu126 -> 2.9.1+cu128 and the
#   matching PyG wheels (+pt29cu128), cuda-nvcc 12.6 -> 12.8. Built by the
#   sidecar envs/equflash.cu128.build.sh (same 2-pass reason as the base).
# Added: gxx=14.4.0 + ninja (host compiler nvcc accepts, JIT build tool; see the
#   dependency comment).
# Everything else (framework pins, ase, extras) is identical to the base recipe.
#
name: equflash
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.12.13
  - pip
  # CUDA 12.8 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.8.*
  # Host compiler for nvcc (D3 kernel, OpenEquivariance/extension JIT builds):
  # CUDA 12.x accepts gcc <= 14, and a current distribution may ship a newer
  # system gcc (Ubuntu 26.04: gcc 15 -> "unsupported GNU version"). The worker
  # puts this env's bin/ first on PATH, so nvcc picks this gcc 14. torch's
  # extension JIT (the D3 kernel) also runs `ninja` from PATH.
  - gxx=14.4.0
  - ninja=1.13.2
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      # torch_scatter/torch_sparse +pt29cu126 wheels are on the PyG wheel index.
      - --find-links https://data.pyg.org/whl/torch-2.9.1+cu128.html
      - torch==2.9.1+cu128
      - fairchem-core==1.10.0
      - torch-geometric==2.6.1
      - torch_scatter==2.1.2+pt29cu128
      - torch_sparse==0.6.18+pt29cu128
      - e3nn==0.5.6
      # EquFlashV2 runtime is cueq-only; cuequivariance pins from GGNN reqs.
      - cuequivariance==0.6.0
      - cuequivariance-torch==0.6.0
      - cuequivariance-ops-torch-cu12==0.6.0
      # GGNN framework package (public): SamsungDS/GGNN.
      - -e git+https://github.com/SamsungDS/GGNN@16b5cae474370977b59120e8bc57e4bcc19cd093#egg=GGNN
      # flashTP_e3nn (v1 only): public github.com/SNU-ARC/flashTP, pinned sha.
      # CUDA source build → install as a documented v1 compile step (needs
      # --no-build-isolation), not an auto pip line; see the Compile note above:
      #   pip install --no-build-isolation \
      #     "flashTP_e3nn @ git+https://github.com/SNU-ARC/flashTP.git@d52e41454afc9636cd51757b65df44e7bcdca178"
