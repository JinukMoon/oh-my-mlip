# build_status: candidate
# candidate-reason: TACE C/CUDA extension requires a CUDA toolkit for compilation. GPU inference requires a driver at the CUDA 13.0+ level (torch 2.11.0+cu130).
# oh-my-mlip env recipe: TACE (tace)
#
# Pins: python 3.11.15 / torch 2.11.0+cu130.
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - torch is pinned to CUDA 13.0 (cu130) from the official PyTorch wheel index;
#     the host NVIDIA driver must satisfy the cu130 min-driver floor.
#   - cuda-nvcc 13.0.* is included for first-run D3 dispersion kernel compilation.
#   - torch-geometric and e3nn are public dependencies.
#   - TACE is the public github.com/xvzemin/tace repo, pinned to a specific commit
#     for reproducibility. Requires CUDA build tools for the C/CUDA extension.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
name: tace
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11.15
  - pip
  # CUDA 13.0 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=13.0.*
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.11.0+cu130
      - torch-geometric==2.8.0
      - e3nn==0.6.0
      # TACE framework (public github.com/xvzemin/tace, pinned sha): C/CUDA build.
      - TACE @ git+https://github.com/xvzemin/tace.git@2b2214e040207b559d6bb4f92072ec1299827ba0
