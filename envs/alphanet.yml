# build_status: clean
# Note: public edition of AlphaNet pinned to github.com/zmyybc/AlphaNet@65f8ea93.
# This commit's gas-phase energies differ from some internal implementations.
# Do NOT install matscipy (forces numpy>=2, breaks torch 2.1.2 ABI; JAX-path only).
# oh-my-mlip env recipe: AlphaNet (alphanet)
#
# Pins: python 3.11.13 / torch 2.1.2+cu121.
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - torch is pinned to CUDA 12.1 (cu121) from the official PyTorch wheel index;
#     the host NVIDIA driver must satisfy the cu121 min-driver floor.
#   - cuda-nvcc 12.1.* is included for first-run D3 dispersion kernel compilation.
#   - torch-scatter is pinned to the matching pt21cu121 wheel that AlphaNet needs.
#   - AlphaNet is pinned to a specific public commit for reproducibility.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
name: alphanet
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11.13
  - pip
  # CUDA 12.1 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.1.*
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      # torch-scatter +pt21cu121 wheels are on the PyG wheel index.
      - --find-links https://data.pyg.org/whl/torch-2.1.2+cu121.html
      - torch==2.1.2+cu121
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2+pt21cu121
      # AlphaNet framework is pinned in the recipe header (requires numpy<2 for
      # torch 2.1.2 ABI compatibility). Do not use floating
      # git+https://github.com/zmyybc/AlphaNet.git.
