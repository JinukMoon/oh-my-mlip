# build_status: clean
# build_note: EquFlashV2 (cueq-only) requires a 2-pass pip install due to a resolver conflict (fairchem-core 1.10 <-> torch 2.9.1 ResolutionImpossible); the multi-pass sidecar envs/equflash.build.sh automates this. EquFlash v1 (flashTP) requires optional CUDA compilation (see Compile note below); v2 does not.
# oh-my-mlip env recipe: EquFlash (SamsungDS/GGNN)
#
# Pins: python 3.12.13 / torch 2.9.1+cu126.
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - torch is pinned to CUDA 12.6 (cu126) from the official PyTorch wheel index;
#     the host NVIDIA driver must satisfy the cu126 min-driver floor.
#   - cuda-nvcc 12.6.* is included for first-run D3 dispersion kernel compilation.
#   - fairchem-core, torch-geometric, and matching torch_scatter/torch_sparse
#     (pt29cu126) wheels are publicly available.
#   - The framework is the public SamsungDS/GGNN package. EquFlashV2 is cueq-only
#     and uses cuequivariance==0.6.0 from GGNN's requirements.txt.
#   - flashTP_e3nn (github.com/SNU-ARC/flashTP) is needed only for EquFlash v1's
#     flashtp backend; v2 does not require it. Compilation requires CUDA build tools.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
# Compile note: EquFlash v1 needs `git clone https://github.com/SNU-ARC/flashTP &&
#   pip install . --no-build-isolation` (CUDA compile). V2 does NOT need flashTP.
#
# WORKING MULTI-PASS INSTALL (EquFlashV2, energy-verified; install.sh single-pass
# can't do this yet — run manually or via a future multi-pass install.sh):
#   pass 1 (torch + PyG + cueq + GGNN), with the PyG find-links:
#     pip install --extra-index-url https://download.pytorch.org/whl/cu126 \
#       -f https://data.pyg.org/whl/torch-2.9.1+cu126.html \
#       torch==2.9.1+cu126 torch-geometric==2.6.1 torch_scatter==2.1.2+pt29cu126 \
#       torch_sparse==0.6.18+pt29cu126 e3nn==0.5.6 cuequivariance==0.6.0 \
#       cuequivariance-torch==0.6.0 cuequivariance-ops-torch-cu12==0.6.0 \
#       "git+https://github.com/SamsungDS/GGNN@16b5cae474370977b59120e8bc57e4bcc19cd093#egg=GGNN"
#   pass 2 (fairchem WITHOUT deps, then GGNN's runtime deps incl. the Alchemi ops):
#     pip install --no-deps fairchem-core==1.10.0
#     pip install pyyaml lmdb numba scipy==1.16.0 pymatgen orjson submitit wandb \
#       torchtnt pydantic huggingface_hub hydra-core tqdm pynvml \
#       nvalchemi-toolkit-ops==0.3.0   # <- provides `nvalchemiops` (GGNN.common.utils)
name: equflash
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.12.13
  - pip
  # CUDA 12.6 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.6.*
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      # torch_scatter/torch_sparse +pt29cu126 wheels are on the PyG wheel index.
      - --find-links https://data.pyg.org/whl/torch-2.9.1+cu126.html
      - torch==2.9.1+cu126
      - fairchem-core==1.10.0
      - torch-geometric==2.6.1
      - torch_scatter==2.1.2+pt29cu126
      - torch_sparse==0.6.18+pt29cu126
      - e3nn==0.5.6
      # EquFlashV2 runtime is cueq-only; cuequivariance pins from GGNN reqs.
      - cuequivariance==0.6.0
      - cuequivariance-torch==0.6.0
      - cuequivariance-ops-torch-cu12==0.6.0
      # GGNN framework package (public): SamsungDS/GGNN.
      - -e git+https://github.com/SamsungDS/GGNN@16b5cae474370977b59120e8bc57e4bcc19cd093#egg=GGNN
      # flashTP_e3nn (v1 only): public github.com/SNU-ARC/flashTP, pinned sha.
      # CUDA source build → install as a documented v1 compile step (needs
      # --no-build-isolation), not an auto pip line; see the Compile note above:
      #   pip install --no-build-isolation \
      #     "flashTP_e3nn @ git+https://github.com/SNU-ARC/flashTP.git@d52e41454afc9636cd51757b65df44e7bcdca178"
