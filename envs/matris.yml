# build_status: candidate
# candidate-reason: MatRIS GPU inference requires an NVIDIA driver at the CUDA 13.0+ level (torch 2.12.1+cu130). Weights (MatRIS_10M_OAM.pth.tar) are pre-staged by scripts/prestage_matris_weights.py for convenience.
# oh-my-mlip env recipe: MatRIS (matris)
#
# Pins: python 3.11.15 / torch 2.12.1+cu130.
# install.sh build-from-recipe is the PRIMARY install path.
#
#   - torch is pinned to CUDA 13.0 (cu130) from the official PyTorch wheel index;
#     the host NVIDIA driver must satisfy the cu130 min-driver floor.
#   - cuda-nvcc 13.0.* is included for D3 dispersion kernel compilation.
#   - matris is installed from its public git repository at a specific commit.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
name: matris
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11.15
  - pip
  # CUDA 13.0 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=13.0.*
  # ase pinned 2026-08-17 to the version present in the env whose GPU
  # single-point verified; a bare `- ase` rode each new release into the
  # build (the mattersim/eqnorm breakage class) and verify_determinism
  # was pip-only, so nothing caught it.
  - ase=3.29.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.1+cu130
      - matris @ git+https://github.com/HPC-AI-Team/MatRIS@c16f569ca08e6905e91b64e2ee68614303e46f7f
