# build_status: clean
# oh-my-mlip env recipe: SevenNet (sevenn)
#
# Validated, buildable recipe. Pins mirror the validated internal setup:
#   python 3.11.13 / torch 2.7.1+cu126.
# install.sh builds this env from this recipe; no prebuilt env is distributed.
#
#   - torch is pinned to the CUDA 12.6 build (cu126) from the official PyTorch
#     wheel index; the host NVIDIA driver must satisfy the cu126 min-driver floor.
#   - cuda-nvcc 12.6.* is included so the D3 dispersion kernel can compile on
#     first run (matching the torch CUDA minor).
#   - sevenn is pinned to the validated git sha.
#   - cuequivariance / e3nn are top-level deps SevenNet needs; small transitive
#     deps are left to float.
#   - catbench is NOT in this recipe's pip block: install.sh installs it as a
#     post-create step (`pip install catbench==1.1.4`, WITH deps). A real build
#     showed `--no-deps` drops catbench's runtime deps (requests/xlsxwriter) and
#     breaks `catbench.adsorption`, while catbench 1.1.2 with deps does NOT
#     downgrade the pinned torch+cuXXX wheel. (A bare `--no-deps` line inside a
#     conda pip block is also an invalid requirement that breaks `conda env create`.)
#   - SevenNet checkpoints (7net-mf-ompa, 7net-omni) ship inside the sevenn
#     package; no weights are bundled separately in this recipe.
name: sevennet
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11.13
  - pip
  # CUDA 12.6 toolchain (provides nvcc for the first-run D3 compile)
  - cuda-nvcc=12.6.*
  # openequivariance is sdist-only; 0.6.6 builds a CMake extension at install
  # that links CUDA::nvrtc. cuda-nvcc alone does not ship nvrtc, so without this
  # the wheel build fails ("Target oeq_stable_cuda links to: CUDA::nvrtc but the
  # target was not found").
  - cuda-nvrtc-dev=12.6.85
  # oeq's first-use JIT (libtorch_tp_jit) links -lcuda: cuda-driver-dev ships the
  # libcuda.so link stub (targets/<arch>/lib/stubs, put on LIBRARY_PATH by the
  # provider). The real driver libcuda is what loads at runtime.
  - cuda-driver-dev=12.6.77
  # ase is pinned to avoid upstream breakage; unpinned ase can introduce
  # incompatibilities with other packages. verify_determinism verifies the pin.
  - ase=3.28.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1+cu126
      - sevenn @ git+https://github.com/MDIL-SNU/SevenNet.git@e72eb2c9ebf6895a9d6fa3318f0ae4409d0f9f73
      - cuequivariance==0.8.0
      - cuequivariance-torch==0.8.0
      - e3nn==0.5.6
      # OpenEquivariance is the default SevenNet backend here (registry inference
      # passes enable_oeq=True; `pip install sevenn[oeq]` == openequivariance).
      # Without it sevenn's patch_oeq only warns and falls back to e3nn.
      # 0.6.6 = the pinned OpenEquivariance version for reproducibility.
      - openequivariance==0.6.6
      # oeq JIT-compiles its CUDA extension at first use -> needs ninja on PATH.
      - ninja==1.13.0
