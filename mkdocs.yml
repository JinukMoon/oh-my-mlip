site_name: oh-my-mlip
site_description: One registry for many machine-learning interatomic potentials — install, run, benchmark, fine-tune, distill.
site_url: https://jinukmoon.github.io/oh-my-mlip/
repo_url: https://github.com/JinukMoon/oh-my-mlip
repo_name: JinukMoon/oh-my-mlip
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    # top tabs for the five sections on every page; the left sidebar also lists
    # every section, expanded, with its pages indented (docs/stylesheets/extra.css
    # undoes the tabs' "active section only" sidebar)
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Get started: start.md
      - Install models: howto/install.md
      - Use a model: howto/use-a-model.md
      - Use with Claude Code: claude_plugin.md
  - Workflows:
      - Benchmark with CatBench: howto/catbench.md
      - VASP results to CatBench: howto/vasp-to-catbench.md
      - Fine-tuning: howto/finetune.md
      - Distillation: howto/distill.md
  - Models:
      - Supported models: model_status.md
      - Install recipes per framework: recipes.md
      - Fine-tuning per framework: finetune.md
      - Licenses: model_licenses.md
      - Gated models: gated_models.md
      - Hugging Face token: hf_token.md
  - Reference:
      - Python API: reference/api.md
      - CatBench data format: catbench_data_format.md
      - GPU-architecture compilation: arch_first_run_compile.md
      - Accelerators: compile.md
      - Weight integrity: weights_integrity.md
      - Host requirements: host_requirements.md
